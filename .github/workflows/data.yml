# Rebuild the scenario data from its public sources and commit it to main (public/data, public/tiles).
# Run by hand from the Actions tab. Everything is fetched and compiled here, on the runner; the build log is
# published to the data-log branch (the sandbox cannot read Actions logs).
name: data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # Free on a public repository; private repositories are billed by the minute. Never run there.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python packages
        run: pip install pyshp shapely numpy pillow netCDF4
      - name: Fetch sources
        run: bash pipeline/fetch.sh raw 2>&1 | tee -a build-log.txt
      - name: Garita's baked data (shelters, facilities, SVI, exposure, hazard tiles)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse -b gh-pages https://github.com/webgpu-demos/garita garita
          git -C garita sparse-checkout set tiles/surge tiles/slide data/island data/geo data/seed data/hazards
          cat garita/data/manifest.json | tee -a build-log.txt
      - name: Compile
        run: |
          set -o pipefail
          { python pipeline/build_scenario.py raw out && python pipeline/build_places.py garita raw out \
            && python pipeline/build_observed.py garita raw out && python pipeline/build_basemap.py garita out \
            && python pipeline/build_intro.py raw out \
            && bash pipeline/stage.sh out garita; } 2>&1 | grep -v 'Possible issue' | tee -a build-log.txt
          cp raw/nhc/hurdat/version.txt public/data/hurdat-version.txt || true
          cp raw/osm/timestamp.txt public/data/osm-timestamp.txt || true
      - name: Check against the sources
        run: python tests/check_data.py public/data 2>&1 | tee -a build-log.txt
      - name: Commit
        run: |
          git config user.name "landfall-pipeline"; git config user.email "actions@users.noreply.github.com"
          git add public/data public/tiles
          if git diff --cached --quiet; then echo "no change" | tee -a build-log.txt; exit 0; fi
          git commit -q -m "data: rebuild from sources $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
          git log --oneline -1 | tee -a build-log.txt
      - name: Publish the log
        if: always()
        run: |
          mkdir -p log && cp build-log.txt log/ && cd log && git init -q -b data-log
          git -c user.name=landfall-pipeline -c user.email=actions@users.noreply.github.com add -A
          git -c user.name=landfall-pipeline -c user.email=actions@users.noreply.github.com commit -q -m "data build log $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:data-log
