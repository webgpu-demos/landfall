# Build the app and publish it to the gh-pages branch on every push to main (Pages serves gh-pages).
name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'tests/check_data.py']
  workflow_dispatch:
  # the data workflow commits with GITHUB_TOKEN, which does not trigger push events; follow it explicitly
  workflow_run:
    workflows: [data]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    # Free on a public repository; private repositories are billed by the minute. Never run there.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to gh-pages
        run: |
          cd dist && touch .nojekyll && git init -q -b gh-pages && git add -A
          git -c user.name=landfall-deploy -c user.email=actions@users.noreply.github.com commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:gh-pages
